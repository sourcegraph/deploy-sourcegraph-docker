services:
  # Description: Jaeger all-in-one instance
  # (https://www.jaegertracing.io/docs/2.16/getting-started/) for distributed tracing.
  #
  # Disk: none
  # Ports exposed to other Sourcegraph services: 4317/TCP (OTLP gRPC) 16686/HTTP
  # Ports exposed to the public internet: none
  # Ports exposed to site admins only: 16686/HTTP
  #
  jaeger:
    container_name: jaeger
    image: 'index.docker.io/sourcegraph/jaeger-all-in-one:8.2.0@sha256:4baf43bb819832161a021088220cc72f03a2fd80b9109d836a36b0b925037964'
    cpus: 0.5
    mem_limit: '512m'
    security_opt:
      - no-new-privileges:true
    ports:
      # Query port
      - '0.0.0.0:16686:16686'
    networks:
      - sourcegraph
    restart: always
    command: ['--config=/etc/jaeger/jaeger-config.yaml']

  # Configure collector to send traces to Jaeger
  otel-collector:
    environment:
      - JAEGER_HOST=jaeger
      - JAEGER_OTLP_GRPC_PORT=4317
    command: ['--config', '/etc/otel-collector/configs/jaeger.yaml']

  # Let frontend proxy to Jaeger interface
  sourcegraph-frontend-0:
    environment:
      - 'JAEGER_SERVER_URL=http://jaeger:16686'

  sourcegraph-frontend-internal:
    environment:
      - 'JAEGER_SERVER_URL=http://jaeger:16686'
