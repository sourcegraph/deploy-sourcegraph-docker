# Development overlay - has reduced resource requirements, and also publishes the deployment
# on port 8080 of every host interface, in addition to ports 80 and 443 from the base file

services:
  zoekt-webserver-0:
    cpus: 1
  zoekt-indexserver-0:
    cpus: 1
  caddy:
    ports:
      - '0.0.0.0:8080:80'
