  blobstore:
  prometheus-v2:
  redis-cache:
  redis-store:
  worker:
  searcher-0:
  sourcegraph-frontend-0:
  sourcegraph-frontend-internal-0:
  zoekt-0-shared:
networks:
  sourcegraph:
