# This file starts only the three databases: pgsql (the primary Sourcegraph database),
# codeintel-db, and codeinsights-db. No other service runs, so nothing else is connected
# to the databases during database-only operations such as backup and restore.
# See https://sourcegraph.com/docs/self-hosted/deploy/docker-compose/operations
#
# `extends` copies each service's definition from docker-compose.yaml, so this file cannot drift from it.
# It does not start any other service from that file
services:
  pgsql:
    extends:
      file: docker-compose.yaml
      service: pgsql

  codeintel-db:
    extends:
      file: docker-compose.yaml
      service: codeintel-db

  codeinsights-db:
    extends:
      file: docker-compose.yaml
      service: codeinsights-db

volumes:
  pgsql:
  codeintel-db:
  codeinsights-db:
networks:
  sourcegraph:
