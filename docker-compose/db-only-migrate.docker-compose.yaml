# This file starts only the pgsql service (the primary Sourcegraph database),
# and the codeintel-db service (a separate Postgres deployment).
# It is used for database-only operations such as backup and restore.
# See https://sourcegraph.com/docs/self-hosted/deploy/docker-compose/operations
#
# Both services are defined in docker-compose.yaml, so this file cannot drift from it
version: '2.4'
services:
  pgsql:
    extends:
      file: docker-compose.yaml
      service: pgsql

  codeintel-db:
    extends:
      file: docker-compose.yaml
      service: codeintel-db

volumes:
  pgsql:
  codeintel-db:
networks:
  sourcegraph:
