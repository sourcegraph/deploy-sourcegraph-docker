services:
  # The executor exits unless both are set.
  # executor-smoke-test.sh sets this password as `executors.accessToken` in the site config
  executor:
    environment:
      - EXECUTOR_FRONTEND_PASSWORD=executor-smoke-test-token
      # Every queue; executor-smoke-test.sh checks for these names.
      # The base file leaves EXECUTOR_QUEUE_NAME empty, which the executor requires with this
      - EXECUTOR_QUEUE_NAMES=batches,batches-hooks,codeintel
