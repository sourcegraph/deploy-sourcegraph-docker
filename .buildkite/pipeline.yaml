$schema: "http://json.schemastore.org/buildkite"
env:
  # GCP VM image for the Vagrant smoke test. Build it in sourcegraph/infrastructure by running `make e2e` in `gcp/images`
  IMAGE: "e2e-db8a40720-2024-08-26t08-44-10z"
  VAGRANT_RUN_ENV: "CI"
steps:
  - label: ":docker:"
    command: .buildkite/validate-docker-compose.sh
    agents: { queue: "vagrant" }

  - label: ":lipstick:"
    command: .buildkite/prettier-check.sh
    agents: { queue: "vagrant" }

  - label: ":bash:"
    command: git ls-files -z '*.sh' .buildkite/hooks | xargs -0 shellcheck
    agents: { queue: "vagrant" }

  # Builds on main always run the smoke test. if_changed compares against origin/main,
  # so it finds no changes in a commit which is already on main, unless it is the newest
  - &smoke_test
    label: ":rice: docker-compose-test"
    command: .buildkite/vagrant-run.sh docker-test
    artifact_paths: ./*.log
    agents: { queue: "vagrant" }
    if: build.branch == "main"

  # Builds on other branches skip the smoke test if they only change files it does not read.
  # New files run it, until someone adds them here
  - <<: *smoke_test
    if: build.branch != "main"
    if_changed:
      include: "**"
      exclude:
        # Docs, including the PR template and READMEs in mounted directories
        - "**.md"
        # GitHub Actions, editor and repository settings
        - ".github/**"
        - ".vscode/**"
        - ".gitignore"
        - "renovate.json"
        # Release manifests
        - "release.yaml"
        - "batch-change/**"
        # Prettier inputs, which the :lipstick: step checks
        - ".prettierignore"
        - "prettier.config.js"
        - "package.json"
        - "package-lock.json"
        # Compose files the smoke test does not start
        - "docker-compose/db-only-migrate.docker-compose.yaml"
        - "docker-compose/dev/**"
        - "docker-compose/examples/**"
        # Caddyfiles the base file leaves commented out
        - "caddy/builtins/https.*"

  # Please keep in mind that the release manifest uses specific branch names when creating releases.
  # Therefore, if you update them, or if you decide to change how we detect what kind of build we're dealing
  # with, please update this file as well.
  - label: "(internal) Release: test"
    if: build.branch =~ /^internal\/release-.*/
    plugins:
      - ssh://git@github.com/sourcegraph/sg-buildkite-plugin.git#main: ~
    command: |
      sg release run test --workdir=. --config-from-commit

  # Promote jobs run only for the promote config commit. Creating the promote
  # branch also builds its first commit, the internal config commit, which
  # --config-from-commit would otherwise accept, running finalize twice.
  - label: "(promote) Release: test"
    if: build.branch =~ /^promote\/release-.*/ && build.branch !~ /-update-main$/ && build.message =~ /^promote-release:/
    plugins:
      - ssh://git@github.com/sourcegraph/sg-buildkite-plugin.git#main: ~
    command: |
      sg release run test --workdir=. --config-from-commit

  - wait

  - label: "(internal) Release: finalize"
    if: build.branch =~ /^internal\/release-.*/
    plugins:
      - ssh://git@github.com/sourcegraph/sg-buildkite-plugin.git#main: ~
    command: |
      sg release run internal finalize --workdir=. --config-from-commit


  - label: "(promote) Release: finalize"
    if: build.branch =~ /^promote\/release-.*/ && build.branch !~ /-update-main$/ && build.message =~ /^promote-release:/
    plugins:
      - ssh://git@github.com/sourcegraph/sg-buildkite-plugin.git#main: ~
    command: |
      sg release run promote-to-public finalize --workdir=. --config-from-commit

