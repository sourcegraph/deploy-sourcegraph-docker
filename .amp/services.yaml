# Services Amp runs in an orb: https://ampcode.com/docs/orbs/portals
# `amp orb services ensure` starts them, and so does opening the Portal tab
services:
  sourcegraph:
    command: .amp/sourcegraph.sh
    # Served by Caddy once .amp/sourcegraph.sh has created the site admin and configured the site
    health: /-/amp-ready
    # .amp/sourcegraph.sh adds the Sourcegraph link, with the admin password in its note
    portals:
      - url: /admin/executors
        title: Executors
      - url: /-/debug/jaeger/
        title: Jaeger
