# Changes the Docker Compose deployment for an Amp orb. .amp/sourcegraph.sh sets both variables
services:
  # Publishes the port Amp chose for the service, which Amp checks as a user who cannot open port 80,
  # and port 80 for the containers the executor starts. Not port 443, where the portal proxy in the orb listens
  caddy:
    ports: !override
      - '${PORT:?}:80'
      - '80:80'
    # Relative to docker-compose/, the directory of the first Compose file
    volumes:
      - '../.amp/Caddyfile:/etc/caddy/Caddyfile'
  # Connects the executor from docker-compose/executors/ to Sourcegraph,
  # with the token .amp/sourcegraph.sh also sets as executors.accessToken in the site configuration
  executor:
    environment:
      - EXECUTOR_FRONTEND_PASSWORD=${EXECUTOR_TOKEN:?}
      # Every queue. The base file leaves EXECUTOR_QUEUE_NAME empty, which the executor requires with this
      - EXECUTOR_QUEUE_NAMES=batches,batches-hooks,codeintel
      # Lets the containers the executor starts reach Caddy at host.docker.internal, the executors.frontendURL
      - EXECUTOR_DOCKER_ADD_HOST_GATEWAY=true
  # Docker refuses a CPU limit above the CPUs in the orb, and an a1.medium orb has 4
  zoekt-indexserver-0:
    cpus: 4
  zoekt-webserver-0:
    cpus: 4
